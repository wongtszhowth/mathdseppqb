<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">HKDSE 數學題目庫</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, 
            output: { font: 'mathjax-termes' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; font-size: 11pt; margin: 0; background: #f8f9fa; color: #333; }
        h1 { font-size: 16pt; text-align: center; margin: 0px 0px 15px 0px; }
        
        /* 篩選器容器 */
        .filter-container {
            position: sticky;
            top: 10px;
            z-index: 1000;
            background: rgba(253, 245, 255, 0.7);
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(51,2,64,0.3);
            backdrop-filter: blur(3px);
            margin: 5px auto 5px auto;
            max-width: 798px;
            max-height: 85dvh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .filter-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0;
        }

        .filter-header-left {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-body { 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-top: 8px;
            flex: 1;
        }

        .filter-scroll-area {
            overflow-y: auto;
            overscroll-behavior: contain;
            padding-bottom: 8px;
        }

        .filter-container.minimized .filter-body { display: none; }
        
        /* 搜尋欄位 + 重設條件按鈕同列 */
        .search-sort-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }

        input[type="text"] { 
            flex: 1; 
            padding: 6px 10px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 11pt; 
            box-sizing: border-box; 
        }

        .sort-select {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 10pt;
            background: #fff;
            color: #334155;
            cursor: pointer;
            outline: none;
            transition: all 0s;
            flex: 1;
            box-sizing: border-box;
        }

        /* 三欄式排版：卷一、卷二、年份 */
        .paper-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .paper-card {
            border: 1px solid #cbd5e1;
            border-radius: 2px;
            background: #fff;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .paper-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        /* 可按壓的標題樣式 (兼具全選功能) */
        .paper-title-btn {
            font-size: 10pt;
            font-weight: bold;
            color: #475569;
            cursor: pointer;
            user-select: none;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0s;
            width: 100%;
        }
        .paper-title-btn:hover {
            background: #64e8dd;
            color: #1e293b;
        }

        .paper-options {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        /* 下拉式清單選單 (課題) */
        .dropdown-select-container {
            position: relative;
            width: 100%;
        }

        .dropdown-btn {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            text-align: left;
            font-size: 10pt;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.18);
            max-height: 18em;
            overflow-y: auto;
            z-index: 200;
            padding: 4px;
            margin-top: 4px;
        }

        .dropdown-menu.show { display: block; }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10pt;
            padding: 2px 6px;
            cursor: pointer;
            border-radius: 4px;
        }
        .checkbox-label:hover { background: #aaf0ea; }

        /* Chips 通用樣式 */
        .filter-title { font-size: 10pt; font-weight: bold; color: #475569; margin-bottom: 4px; margin-top: 12px; }
        .chip-group { display: flex; flex-wrap: wrap; gap: 3px; }
        .chip { 
            padding: 1px 3px !important; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 10pt; 
            cursor: pointer; 
            background: #fff; 
            user-select: none; 
            transition: all 0s; 
            color: #334155; 
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .chip:hover { border-color: #94a3b8; background: #aaf0ea; }
        .chip.active { background: #8b5cf6; color: white; border-color: #7c3aed; }
        .chip-year.active { background: #0f766e; color: white; border-color: #0f766e; }

        .chip-diff[data-value="1"].active { background: #0284c7; border-color: #0369a1; color: white; }
        .chip-diff[data-value="2"].active { background: #d97706; border-color: #b45309; color: white; }
        .chip-diff[data-value="3"].active { background: #dc2626; border-color: #b91c1c; color: white; }

        /* 範疇色彩區分 */
        .domain-algebra .dropdown-btn { border-color: #93c5fd; background: #eff6ff; color: #1e40af; }
        .domain-algebra .btn-select-all { background: #dbeafe; border-color: #bfdbfe; color: #1e40af; }
        .domain-algebra .checkbox-label:hover { background: #eff6ff; }

        .domain-geo .dropdown-btn { border-color: #86efac; background: #f0fdf4; color: #166534; }
        .domain-geo .btn-select-all { background: #dcfce7; border-color: #bbf7d0; color: #166534; }
        .domain-geo .checkbox-label:hover { background: #f0fdf4; }

        .domain-data .dropdown-btn { border-color: #fde047; background: #fefce8; color: #854d0e; }
        .domain-data .btn-select-all { background: #fef9c3; border-color: #fef08a; color: #854d0e; }
        .domain-data .checkbox-label:hover { background: #fefce8; }

        /* 按鈕樣式 */
        .btn-group-action { 
            display: flex; 
            gap: 8px; 
            padding-top: 10px; 
            margin-top: 4px;
            position: sticky;
            bottom: 0;
            background: rgba(253, 245, 255, 0.98);
            z-index: 300;
            border-top: 1px solid rgba(203, 213, 225, 0.5);
            flex-shrink: 0;
        }
        .btn { padding: 3px 4px; border: none; border-radius: 8px; font-size: 9pt; cursor: pointer; font-weight: 500; transition: all 1s; white-space: nowrap; }
        .btn-toggle { background: #5e1e96; color: white; border: 2px outset #9621ff; font-weight: bold; padding: 0 10px; }
        .btn-lang { background: #0284c7; color: white; border: 2px outset #38bdf8; font-weight: bold; padding: 0 8px; }
        .btn-reset { background: #4c3e5c; color: yellow; height: 30px; border: 2px outset red; }
        .btn-cancel { background: #e2e8f0; color: #334155; }
        
        .btn-mistake-mode { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; font-weight: bold; }
        .btn-mistake-mode.active { background: #dc2626; color: white; }
        
        .btn-completed-mode { background: #dcfce7; color: #166534; border: 1px solid #86efac; font-weight: bold; }
        .btn-completed-mode.active { background: #16a34a; color: white; }

        .btn-io { background: #ffdfc7; color: #0369a1; border: 1px solid #ff882e; font-weight: bold; padding: 0 6px; }

        .btn-apply { background: #7c3aed; color: white; font-weight: bold; padding: 8px 18px; font-size: 10pt; flex: 1; border-radius: 8px; }
        .btn-apply:hover { background: #6d28d9; }

        .btn-select-all { font-size: 8pt; padding: 1px 4px; border-radius: 4px; background: #e2e8f0; border: 1px solid #cbd5e1; cursor: pointer; width: 80px; height: 33px; }

        /* 題目卡片 */
        #list { max-width: 800px; margin: 0 auto; padding-bottom: 8px; }
        .question-card { background: #fff; border: 1px solid #e2e8f0; padding: 18px; margin: 15px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); position: relative; transition: border-color 0.3s ease; }
        .question-card.is-completed { border: 1px solid #22c55e !important; box-shadow: 0 2px 8px rgba(34,197,94,0.4); }

        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; margin: 0 0 14px 0; }
        .q-id { font-family: SFMono-Regular, Consolas, Menlo, monospace; font-size: 9pt; color: #64748b; font-weight: 600; }
        
        .diff-badge { font-size: 9pt; font-weight: bold; padding: 2px 8px; border-radius: 6px; }
        .diff-lv1 { background: #e0f2fe; color: #0369a1; }
        .diff-lv2 { background: #fef3c7; color: #b45309; }
        .diff-lv3 { background: #fee2e2; color: #b91c1c; }

        /* 題目內容 */
        .question-content, .detail-content { font-family: Times, "Times New Roman", "PMingLiU", "新細明體", serif; font-size: 11pt; line-height: 1.7; margin: 12px 0; white-space: pre-wrap; letter-spacing: 0.05em; }
        .q-img { display: block; max-width: 100%; height: auto; margin: 15px auto; }

        .q-line { display: flex; align-items: flex-start; width: 100%; box-sizing: border-box; margin-top: 5px; margin-bottom: 3px; letter-spacing: 0.05em; }
        .q-line.q-level-2 { margin-left: 40px; width: calc(100% - 40px); letter-spacing: 0.05em; }
        .q-line.q-level-3 { margin-left: 80px; width: calc(100% - 80px); letter-spacing: 0.05em; }
        .q-label { flex-shrink: 0; width: 40px; }
        .q-text-content { flex-grow: 1; min-width: 0; word-break: break-word; letter-spacing: 0.05em; }
        .q-mcopt { margin-left: 40px; width: calc(100% - 40px); line-height: 1.2; white-space: pre-wrap; letter-spacing: 0.05em; }
        .q-mcms { margin-left: 20px; width: calc(100% - 20px); white-space: pre-wrap; letter-spacing: 0.05em; }
        .marks { float: right; padding-left: 3px; font-weight: normal; letter-spacing: 0.05em; }
        .q-clearfix { clear: both; }

        details { margin-top: 5px; background: #f8fafc; border-radius: 5px; overflow: hidden; }
        summary { padding: 3px 5px; font-weight: bold; color: #475569; cursor: pointer; }
        .detail-content { padding: 0px 5px; background: #ffffff; }

        .ms-container {
            width: 100%;
            margin: 12px 0;
            font-family: Times, "Times New Roman", "PMingLiU", "新細明體", serif;
            font-size: 10pt;
            letter-spacing: 0em;
            white-space: pre-wrap;
        }
        .ms-row {
            display: grid;
            grid-template-columns: 25px 25px 25px 1fr 65px;
            align-items: start;
            line-height: 1.7;
            padding: 1px 0px;
            margin-bottom: 0px;
        }
        .ms-num1 { grid-column: 1; }
        .ms-num2 { grid-column: 2; }
        .ms-num3 { grid-column: 3; }
        .ms-content { grid-column: 4; }
        .ms-content.ms-from-l1 { grid-column: 1 / 5; }
        .ms-content.ms-from-l2 { grid-column: 2 / 5; }
        .ms-content.ms-from-l3 { grid-column: 3 / 5; }
        .ms-mark { grid-column: 5; text-align: center; white-space: nowrap; align-self: center; }

        .card-actions { display: flex; justify-content: flex-end; margin-top: 10px; gap: 8px; }
        .btn-card { padding: 4px 10px; font-size: 10pt; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; cursor: pointer; transition: all 0.2s; color: #475569; }
        .btn-card:hover { background: #f1f5f9; }
        .btn-card.is-saved { background: #fef2f2; border-color: #fca5a5; color: #dc2626; }
        .btn-card.is-done { background: #f0fdf4; border-color: #86efac; color: #16a34a; }

        .note-box { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 10pt; }
        .mistake-note-box { background: #fff5f5; border: 1px dashed #fca5a5; color: #991b1b; }
        .completed-note-box { background: #f0fdf4; border: 1px dashed #86efac; color: #166534; margin-top: 6px; }
        .note-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; font-size: 10pt; }

        /* Modal 彈出視窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(0px); z-index: 2000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: #fff; width: 90%; max-width: 500px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
        .modal-header { font-size: 14px; font-weight: bold; color: #1e293b; }
        .modal-textarea { width: 100%; min-height: 100px; max-height: 300px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12pt; font-family: Times; resize: vertical; box-sizing: border-box; outline: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

        .loading-box { text-align: center; padding: 40px 20px; color: #4b5563; }
        .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid rgba(124, 58, 237, 0.2); border-radius: 50%; border-top-color: #7c3aed; animation: spin 0.8s ease-in-out infinite; margin-bottom: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h1 id="mainHeader">🔍 HKDSE 數學題目庫 🔎</h1>
    
    <div class="filter-container" id="filterContainer">
        <div class="filter-header">
            <div class="filter-header-left">
                <button class="btn btn-toggle" id="toggleBtn" onclick="toggleFilter()">👀 篩選器</button>
                <button class="btn btn-completed-mode" id="completedModeBtn" onclick="toggleCompletedMode()">☑️ (<span id="completedCount">0</span>)</button>
                <button class="btn btn-mistake-mode" id="mistakeModeBtn" onclick="toggleMistakeMode()">📌 (<span id="mistakeCount">0</span>)</button>
                <button class="btn btn-io" onclick="openTextExportModal()">💾</button>
                <button class="btn btn-io" onclick="openTextImportModal()">📥</button>
                <button class="btn btn-lang" id="langBtn" onclick="toggleLanguage()">🌐 Eng</button>
            </div>
        </div>
        
        <div class="filter-body">
            <div class="filter-scroll-area">
                <!-- 搜尋欄位與重設條件按鈕同列 -->
                <div class="search-sort-row">
                    <input type="text" id="keyword" placeholder="搜尋題目關鍵字..." onkeydown="if(event.key === 'Enter') applyFilter(false, false)">
                    <button class="btn btn-reset" id="resetBtn" onclick="resetFilters()">重設條件</button>
                </div>

                <!-- 三欄式排版：卷一、卷二、年份 (標題點擊可全選) -->
                <div class="paper-grid">
                    <!-- 第一欄：卷一 -->
                    <div class="paper-card">
                        <div class="paper-header">
                            <span class="paper-title-btn" id="titleP1" onclick="togglePaperSelectAll('P1')" title="點擊全選/取消全選">📄 卷一 🔄</span>
                        </div>
                        <div class="paper-options">
                            <label class="checkbox-label"><input type="checkbox" class="paper-cb" data-type="P1" data-section="A1" onchange="updateFilterCount()"> <span id="lblP1A1">甲部(1)</span></label>
                            <label class="checkbox-label"><input type="checkbox" class="paper-cb" data-type="P1" data-section="A2" onchange="updateFilterCount()"> <span id="lblP1A2">甲部(2)</span></label>
                            <label class="checkbox-label"><input type="checkbox" class="paper-cb" data-type="P1" data-section="B" onchange="updateFilterCount()"> <span id="lblP1B">乙部</span></label>
                        </div>
                    </div>

                    <!-- 第二欄：卷二 -->
                    <div class="paper-card">
                        <div class="paper-header">
                            <span class="paper-title-btn" id="titleP2" onclick="togglePaperSelectAll('P2')" title="點擊全選/取消全選">📄 卷二 🔄</span>
                        </div>
                        <div class="paper-options">
                            <label class="checkbox-label"><input type="checkbox" class="paper-cb" data-type="P2" data-section="MC_A" onchange="updateFilterCount()"> <span id="lblP2A">甲部</span></label>
                            <label class="checkbox-label"><input type="checkbox" class="paper-cb" data-type="P2" data-section="MC_B" onchange="updateFilterCount()"> <span id="lblP2B">乙部</span></label>
                        </div>
                    </div>

                    <!-- 第三欄：年份 (標題點擊可全選) -->
                    <div class="paper-card">
                        <div class="paper-header">
                            <span class="paper-title-btn" id="titleYear" onclick="toggleYearSelectAll()" title="點擊全選/取消全選">📅 年份 🔄</span>
                        </div>
                        <div class="year-scroll-box">
                            <div class="chip-group" id="yearChipGroup">
                                <!-- 由 JS 自動渲染 '25 至 '12 Chip 按鈕 -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 級別與難度 -->
                <div>
                    <div class="filter-title" id="titleLevelDiff">🔥 級別 及 難度</div>
                    <div class="chip-group">
                        <button class="chip" id="chipJunior" data-group="level" data-value="Junior" onclick="toggleChip(this)" style="width: 55px; height: 33px;">初中</button>
                        <button class="chip" id="chipSenior" data-group="level" data-value="Senior" onclick="toggleChip(this)" style="width: 55px; height: 33px;">高中</button>
                        <span style="color:#cbd5e1; font-weight:bold; margin: 0 4px;">|</span>
                        <button class="chip chip-diff" data-group="diff" data-value="1" onclick="toggleChip(this)" style="width: 55px; height: 33px;">Lv.2</button>
                        <button class="chip chip-diff" data-group="diff" data-value="2" onclick="toggleChip(this)" style="width: 55px; height: 33px;">Lv.3-4</button>
                        <button class="chip chip-diff" data-group="diff" data-value="3" onclick="toggleChip(this)" style="width: 55px; height: 33px;">Lv.5+</button>
                    </div>
                </div>

                <!-- 範疇與課題 -->
                <div>
                    <div class="filter-title" id="titleDomainTopic">🧩 範疇 與 課題</div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        
                        <!-- 數與代數 -->
                        <div class="dropdown-select-container domain-algebra">
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <button class="dropdown-btn" onclick="toggleDropdown('algebraDropdown')">
                                    <span><span id="domainAlgebra">數與代數</span> <span id="algebraCountLabel">(0/25)</span></span> ▾
                                </button>
                                <button class="btn-select-all btn-sel-all" onclick="toggleDropdownSelectAll('algebraDropdown', this)">全選</button>
                            </div>
                            <div class="dropdown-menu" id="algebraDropdown">
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Laws of Indices" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Laws of Indices">指數律</span></label>
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Factorization" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Factorization">因式分解</span></label>
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Change of Subject" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Change of Subject">主項變換</span></label>
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Algebraic Expressions" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Algebraic Expressions">代數式</span></label>
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Algebraic Fractions and Fractional Equations" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Algebraic Fractions and Fractional Equations">代數分式及分式方程</span></label>
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Identities" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Identities">恆等式</span></label>
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Base Conversion" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Base Conversion">進制轉換</span></label>
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Approximation and Errors" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Approximation and Errors">近似與誤差</span></label>
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Estimation" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Estimation">估算</span></label>
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Complex Numbers" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Complex Numbers">複數</span></label>
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Percentages" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Percentages">百分法</span></label>
                                <label class="checkbox-label"><input type="checkbox" class="topic-cb" value="Rates, Ratios and Proportions" onchange="updateFilterCount()"> <span class="topic-text" data-topic="Rates, Ratios and Proportions">率、比及比例</span></label>

            document.getElementById('titleYear').innerText = lang.titleYear;
            
            document.getElementById('lblP1A1').innerText = lang.lblP1A1;
            document.getElementById('lblP1A2').innerText = lang.lblP1A2;
            document.getElementById('lblP1B').innerText = lang.lblP1B;
            document.getElementById('lblP2A').innerText = lang.lblP2A;
            document.getElementById('lblP2B').innerText = lang.lblP2B;

            document.getElementById('titleLevelDiff').innerText = lang.titleLevelDiff;
            document.getElementById('chipJunior').innerText = lang.chipJunior;
            document.getElementById('chipSenior').innerText = lang.chipSenior;

            document.getElementById('titleDomainTopic').innerText = lang.titleDomainTopic;
            document.getElementById('domainAlgebra').innerText = lang.domainAlgebra;
            document.getElementById('domainGeo').innerText = lang.domainGeo;
            document.getElementById('domainData').innerText = lang.domainData;

            document.querySelectorAll('.btn-sel-all').forEach(btn => {
                const isDeselect = btn.getAttribute('data-is-all') === 'true';
                btn.innerText = isDeselect ? lang.deselectAll : lang.selectAll;
            });

            document.getElementById('optSortType').innerText = lang.optSortType;
            document.getElementById('optSortYearDesc').innerText = lang.optSortYearDesc;
            document.getElementById('optSortYearAsc').innerText = lang.optSortYearAsc;
            document.getElementById('optSortDiffAsc').innerText = lang.optSortDiffAsc;
            document.getElementById('optSortDiffDesc').innerText = lang.optSortDiffDesc;
            document.getElementById('optSortTimeDesc').innerText = lang.optSortTimeDesc;
            document.getElementById('applyBtn').innerText = lang.applyBtn;

            document.querySelectorAll('.topic-text').forEach(span => {
                const topicKey = span.getAttribute('data-topic');
                if (lang.topics[topicKey]) {
                    span.innerText = lang.topics[topicKey];
                }
            });
        }

        function getTextByLang(field) {
            if (!field) return '';
            if (typeof field === 'string') return field;
            return field[currentLang] || field['tc'] || '';
        }

        function initYearChips() {
            const container = document.getElementById('yearChipGroup');
            let html = '';
            for(let y = 2025; y >= 2012; y--) {
                const shortYear = `'${y.toString().slice(-2)}`;
                html += `<button class="chip chip-year" style="font-family: SFMono-Regular, Consolas, Menlo, monospace; letter-spacing: -0.05em;" data-group="year" data-value="${y}" onclick="toggleChip(this)">${shortYear}</button>`;
            }
            container.innerHTML = html;
        }

        function getStorageData(key) {
            try { return JSON.parse(localStorage.getItem(key)) || {}; } 
            catch (e) { return {}; }
        }

        function saveStorageData(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
            updateBadges();
        }

        function updateBadges() {
            const mistakes = getStorageData(STORAGE_MISTAKES);
            const completed = getStorageData(STORAGE_COMPLETED);
            document.getElementById('mistakeCount').innerText = Object.keys(mistakes).length;
            document.getElementById('completedCount').innerText = Object.keys(completed).length;
        }

        function updateFilterCount() {
            updateDomainCount('algebraDropdown', 'algebraCountLabel');
            updateDomainCount('geoDropdown', 'geoCountLabel');
            updateDomainCount('dataDropdown', 'dataCountLabel');
        }

        function updateDomainCount(dropdownId, labelId) {
            const all = document.querySelectorAll(`#${dropdownId} .topic-cb`);
            const checked = document.querySelectorAll(`#${dropdownId} .topic-cb:checked`);
            document.getElementById(labelId).innerText = `(${checked.length}/${all.length})`;
        }

        function toggleDropdown(id) {
            const target = document.getElementById(id);
            const isShowing = target.classList.contains('show');
            document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));

            if (!isShowing) {
                target.classList.add('show');
                setTimeout(() => { target.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
            }
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropdown-btn') && !event.target.closest('.dropdown-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show') && !event.target.closest('.dropdown-select-container')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        function toggleDropdownSelectAll(dropdownId, btn) {
            const checkboxes = document.querySelectorAll(`#${dropdownId} .topic-cb`);
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            btn.setAttribute('data-is-all', (!allChecked).toString());
            btn.innerText = !allChecked ? i18n[currentLang].deselectAll : i18n[currentLang].selectAll;
            updateFilterCount();
        }

        /* 點擊標題實作全選功能 */
        function togglePaperSelectAll(paperType) {
            const checkboxes = document.querySelectorAll(`.paper-cb[data-type="${paperType}"]`);
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            updateFilterCount();
        }

        function toggleYearSelectAll() {
            const chips = document.querySelectorAll('#yearChipGroup .chip-year');
            const allActive = Array.from(chips).every(c => c.classList.contains('active'));
            chips.forEach(c => {
                if (allActive) c.classList.remove('active');
                else c.classList.add('active');
            });
        }

        function toggleChip(button) {
            button.classList.toggle('active');
        }

        function getFormattedNow() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        }

        /* 筆記視窗 */
        function addOrEditMistake(qId) {
            currentTargetQId = qId;
            currentTargetType = 'mistake';
            const mistakes = getStorageData(STORAGE_MISTAKES);
            const existingNote = mistakes[qId] ? mistakes[qId].note : '';

            openModal(i18n[currentLang].mistakeModalTitle(qId), existingNote, [
                `<button class="btn btn-cancel" onclick="closeModal()" style="width: 80px;">${i18n[currentLang].cancelBtn}</button>`,
                `<button class="btn btn-apply" onclick="saveNoteModal()">${i18n[currentLang].saveBtn}</button>`
            ]);
        }

        function addOrEditCompleted(qId) {
            currentTargetQId = qId;
            currentTargetType = 'completed';
            const completed = getStorageData(STORAGE_COMPLETED);
            const existingNote = completed[qId] ? completed[qId].note : '';

            openModal(i18n[currentLang].completedModalTitle(qId), existingNote, [
                `<button class="btn btn-cancel" onclick="closeModal()" style="width: 80px;">${i18n[currentLang].cancelBtn}</button>`,
                `<button class="btn btn-apply" onclick="saveNoteModal()">${i18n[currentLang].saveBtn}</button>`
            ]);
        }

        function openModal(title, text, actionBtnsHtml) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalTextarea').value = text;
            document.getElementById('modalActions').innerHTML = actionBtnsHtml.join('');
            document.getElementById('commonModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('commonModal').classList.remove('active');
            currentTargetQId = null;
            currentTargetType = null;
        }

        function saveNoteModal() {
            if (!currentTargetQId || !currentTargetType) return;
            const note = document.getElementById('modalTextarea').value.trim();
            const timeStr = getFormattedNow();

            if (currentTargetType === 'mistake') {
                const mistakes = getStorageData(STORAGE_MISTAKES);
                mistakes[currentTargetQId] = { note: note, time: timeStr };
                saveStorageData(STORAGE_MISTAKES, mistakes);
            } else {
                const completed = getStorageData(STORAGE_COMPLETED);
                completed[currentTargetQId] = { note: note, time: timeStr };
                saveStorageData(STORAGE_COMPLETED, completed);
            }

            closeModal();
            applyFilter(true);
        }

        /* 手機適用：純文字 匯出/匯入 功能 */
        function openTextExportModal() {
            const exportObj = {
                version: "1.0",
                exportTime: new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Hong_Kong' }),
                mistakes: getStorageData(STORAGE_MISTAKES),
                completed: getStorageData(STORAGE_COMPLETED)
            };
            const jsonStr = JSON.stringify(exportObj, null, 2);

            openModal(i18n[currentLang].exportTitle, jsonStr, [
                `<button class="btn btn-cancel" onclick="closeModal()" style="width: 80px;">${i18n[currentLang].closeBtn}</button>`,
                `<button class="btn btn-apply" onclick="copyExportText()">${i18n[currentLang].copyBtn}</button>`
            ]);
        }

        function copyExportText() {
            const textarea = document.getElementById('modalTextarea');
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(textarea.value).then(() => {
                alert(i18n[currentLang].copiedSuccess);
            }).catch(() => {
                document.execCommand('copy');
                alert(i18n[currentLang].copiedSuccess);
            });
        }

        function openTextImportModal() {
            openModal(i18n[currentLang].importTitle, '', [
                `<button class="btn btn-cancel" onclick="closeModal()" style="width: 80px;">${i18n[currentLang].cancelBtn}</button>`,
                `<button class="btn btn-apply" onclick="applyTextImport()">${i18n[currentLang].confirmImportBtn}</button>`
            ]);
            document.getElementById('modalTextarea').placeholder = i18n[currentLang].modalPlaceholder;
        }

        function applyTextImport() {
            const rawText = document.getElementById('modalTextarea').value.trim();
            if (!rawText) {
                alert(i18n[currentLang].pastePrompt);
                return;
            }

            try {
                const data = JSON.parse(rawText);
                if (data.mistakes || data.completed) {
                    if (confirm(i18n[currentLang].importConfirm)) {
                        saveStorageData(STORAGE_MISTAKES, data.mistakes || {});
                        saveStorageData(STORAGE_COMPLETED, data.completed || {});
                        alert(i18n[currentLang].importSuccess);
                        closeModal();
                        applyFilter(true);
                    }
                } else {
                    alert(i18n[currentLang].invalidFormat);
                }
            } catch (err) {
                alert(i18n[currentLang].parseError);
            }
        }

        function removeMistake(qId) {
            if (confirm(i18n[currentLang].removeMistakeConfirm(qId))) {
                const mistakes = getStorageData(STORAGE_MISTAKES);
                delete mistakes[qId];
                saveStorageData(STORAGE_MISTAKES, mistakes);
                applyFilter(true);
            }
        }

        function removeCompleted(qId) {
            if (confirm(i18n[currentLang].removeCompletedConfirm(qId))) {
                const completed = getStorageData(STORAGE_COMPLETED);
                delete completed[qId];
                saveStorageData(STORAGE_COMPLETED, completed);
                applyFilter(true);
            }
        }

        function toggleMistakeMode() {
            isMistakeOnlyMode = !isMistakeOnlyMode;
            if(isMistakeOnlyMode) isCompletedOnlyMode = false;
            updateModeButtons();
            applyFilter(false);
        }

        function toggleCompletedMode() {
            isCompletedOnlyMode = !isCompletedOnlyMode;
            if(isCompletedOnlyMode) isMistakeOnlyMode = false;
            updateModeButtons();
            applyFilter(false);
        }

        function updateModeButtons() {
            const mBtn = document.getElementById('mistakeModeBtn');
            const cBtn = document.getElementById('completedModeBtn');
            if(isMistakeOnlyMode) mBtn.classList.add('active'); else mBtn.classList.remove('active');
            if(isCompletedOnlyMode) cBtn.classList.add('active'); else cBtn.classList.remove('active');
        }

        function applyFilter(keepScroll = false, minimize = true) {
            const currentScroll = keepScroll ? window.scrollY : 0;

            if (minimize) {
                const container = document.getElementById('filterContainer');
                if (!container.classList.contains('minimized')) {
                    container.classList.add('minimized');
                    document.getElementById('toggleBtn').innerText = i18n[currentLang].toggleFilter;
                }
            }

            const list = document.getElementById('list');
            list.innerHTML = `<div class="loading-box"><div class="spinner"></div><div>${i18n[currentLang].loading}</div></div>`;
            setTimeout(() => filterData(currentScroll), 50);
        }

        async function filterData(targetScrollY) {
            const keyword = document.getElementById('keyword').value.toLowerCase();
            const sortBy = document.getElementById('sortBy').value;

            const paperCBs = Array.from(document.querySelectorAll('.paper-cb:checked'));
            const selectedTypes = [...new Set(paperCBs.map(cb => cb.getAttribute('data-type')))];
            const selectedSections = paperCBs.map(cb => cb.getAttribute('data-section'));

            const selectedYears = Array.from(document.querySelectorAll('.chip.active[data-group="year"]')).map(c => c.getAttribute('data-value'));
            const selectedTopics = Array.from(document.querySelectorAll('.topic-cb:checked')).map(cb => cb.value);

            const selectedLevels = Array.from(document.querySelectorAll('.chip.active[data-group="level"]')).map(c => c.getAttribute('data-value'));
            const selectedDiffs = Array.from(document.querySelectorAll('.chip.active[data-group="diff"]')).map(c => c.getAttribute('data-value'));

            const mistakes = getStorageData(STORAGE_MISTAKES);
            const completed = getStorageData(STORAGE_COMPLETED);

            const isNoCondition = keyword === "" && selectedLevels.length === 0 && selectedTypes.length === 0 && 
                                  selectedYears.length === 0 && selectedDiffs.length === 0 && selectedTopics.length === 0;

            const list = document.getElementById('list');

            if (!isMistakeOnlyMode && !isCompletedOnlyMode && isNoCondition) {
                list.innerHTML = `<p style="text-align:center; color:#777; margin-top:50px;">${i18n[currentLang].noConditionPrompt}</p>`;
                return;
            }

            if (typeof questions === 'undefined') return;

            let filtered = questions.filter(q => {
                if (isMistakeOnlyMode && !mistakes[q.id]) return false;
                if (isCompletedOnlyMode && !completed[q.id]) return false;

                const qContent = getTextByLang(q.content);
                const qHint = getTextByLang(q.hint);
                const qSolution = getTextByLang(q.solution);

                const matchKeyword = qContent.toLowerCase().includes(keyword) || 
                                     q.id.toLowerCase().includes(keyword) || 
                                     qSolution.toLowerCase().includes(keyword) || 
                                     qHint.toLowerCase().includes(keyword);
                                     
                const matchLevel = selectedLevels.length === 0 || (Array.isArray(q.level) ? q.level.some(l => selectedLevels.includes(l)) : selectedLevels.includes(q.level));
                const matchType = selectedTypes.length === 0 || selectedTypes.includes(q.type);
                const matchSection = selectedSections.length === 0 || (q.section && selectedSections.includes(q.section));
                const matchYear = selectedYears.length === 0 || selectedYears.includes(q.year.toString());
                const matchDiff = selectedDiffs.length === 0 || selectedDiffs.includes(q.difficulty.toString());
                const matchTopic = selectedTopics.length === 0 || (Array.isArray(q.topic) ? q.topic.some(t => selectedTopics.includes(t)) : selectedTopics.includes(q.topic));
                
                return matchKeyword && matchLevel && matchType && matchSection && matchYear && matchDiff && matchTopic;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'year-desc') return parseInt(b.year) - parseInt(a.year);
                if (sortBy === 'year-asc') return parseInt(a.year) - parseInt(a.year);
                if (sortBy === 'type') return a.type.localeCompare(b.type);
                if (sortBy === 'diff-asc') return (a.difficulty || 0) - (b.difficulty || 0);
                if (sortBy === 'diff-desc') return (b.difficulty || 0) - (a.difficulty || 0);
                if (sortBy === 'time-desc') {
                    const tA = (mistakes[a.id]?.time || completed[a.id]?.time || '');
                    const tB = (mistakes[b.id]?.time || completed[b.id]?.time || '');
                    return tB.localeCompare(tA);
                }
                return 0;
            });

            if(filtered.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#999; margin-top:50px;">${i18n[currentLang].noResultPrompt}</p>`;
                return;
            }

            list.innerHTML = filtered.map(q => {
                const mInfo = mistakes[q.id];
                const cInfo = completed[q.id];
                const isSaved = !!mInfo;
                const isDone = !!cInfo;

                const contentText = getTextByLang(q.content);
                const hintText = getTextByLang(q.hint);
                const solutionText = getTextByLang(q.solution);

                return `
                <div class="question-card ${isDone ? 'is-completed' : ''}">
                    <div class="card-header">
                        <div class="q-id">${q.id}</div>
                        ${getDifficultyBadge(q.difficulty)}
                    </div>
                    <div class="question-content">${contentText}</div>
                    
                    ${hintText ? `
                    <details>
                        <summary>💡</summary>
                        <div class="detail-content">${hintText}</div>
                    </details>` : ''}
                    
                    ${solutionText ? `
                    <details>
                        <summary>🔑</summary>
                        <div class="detail-content">${solutionText}</div>
                    </details>` : ''}

                    ${isSaved ? `
                        <div class="note-box mistake-note-box">
                            <div class="note-header"><span>${i18n[currentLang].mistakeNoteTitle}</span><span>${mInfo.time}</span></div>
                            <div style="white-space: pre-wrap;">${mInfo.note}</div>
                        </div>
                    ` : ''}

                    ${isDone ? `
                        <div class="note-box completed-note-box">
                            <div class="note-header"><span>${i18n[currentLang].completedRecordTitle}</span><span>${cInfo.time}</span></div>
                            <div style="white-space: pre-wrap;">${cInfo.note}</div>
                        </div>
                    ` : ''}

                    <div class="card-actions">
                        ${isDone ? `
                            <button class="btn-card is-done" onclick="addOrEditCompleted('${q.id}')">${i18n[currentLang].editNoteBtn}</button>
                            <button class="btn-card" onclick="removeCompleted('${q.id}')">${i18n[currentLang].removeCompletedBtn}</button>
                        ` : `
                            <button class="btn-card" style="border: 1px solid #86efac;" onclick="addOrEditCompleted('${q.id}')">☑️</button>
                        `}

                        ${isSaved ? `
                            <button class="btn-card is-saved" onclick="addOrEditMistake('${q.id}')">${i18n[currentLang].editMistakeNoteBtn}</button>
                            <button class="btn-card" onclick="removeMistake('${q.id}')">${i18n[currentLang].removeMistakeBtn}</button>
                        ` : `
                            <button class="btn-card" style="border: 1px solid #fca5a5;"  onclick="addOrEditMistake('${q.id}')">📌</button>
                        `}
                    </div>
                </div>
            `}).join('');

            if (window.MathJax && MathJax.typesetPromise) {
                await MathJax.typesetPromise();
            }

            if (targetScrollY > 0) {
                window.scrollTo({ top: targetScrollY, behavior: 'instant' });
            }
        }

        function getDifficultyBadge(diff) {
            if (diff === 1) return `<span class="diff-badge diff-lv1">Lv.2</span>`;
            if (diff === 2) return `<span class="diff-badge diff-lv2">Lv.3-4</span>`;
            if (diff === 3) return `<span class="diff-badge diff-lv3">Lv.5+</span>`;
            return '';
        }

        function resetFilters() {
            document.getElementById('keyword').value = "";
            document.getElementById('sortBy').value = "year-desc";
            document.querySelectorAll('.chip.active').forEach(chip => chip.classList.remove('active'));
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            
            document.querySelectorAll('.btn-select-all').forEach(btn => {
                btn.removeAttribute('data-is-all');
                btn.innerText = i18n[currentLang].selectAll;
            });

            updateFilterCount();
            applyFilter(false);
        }

        function toggleFilter() {
            const container = document.getElementById('filterContainer');
            const toggleBtn = document.getElementById('toggleBtn');
            
            if (container.classList.contains('minimized')) {
                container.classList.remove('minimized');
                toggleBtn.innerText = i18n[currentLang].toggleFilter;
            } else {
                container.classList.add('minimized');
                toggleBtn.innerText = i18n[currentLang].toggleFilter;
            }
        }

        initYearChips();
        updateUIStrings();
        updateBadges();
        updateFilterCount();
        applyFilter(false, false);
    </script>
</body>
</html>
